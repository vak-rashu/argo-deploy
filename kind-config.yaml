kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: llm-gitops-cluster
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30081
        hostPort: 8081
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30090
        hostPort: 9091
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
